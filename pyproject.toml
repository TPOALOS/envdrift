[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envdrift"
version = "1.1.0"
description = "Detect drift between .env.example and .env files, flag unchanged secrets and placeholders, without ever printing values. JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["dotenv", "environment-variables", "devops", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/envdrift"

[project.scripts]
envdrift = "envdrift:main"

[tool.setuptools]
py-modules = ["envdrift"]
